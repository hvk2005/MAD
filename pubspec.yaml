name: smartfab_material_tracking
description: "A Material Tracking & Costing App for SmartFab Industries"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_auth_web: ^5.7.0
  firebase_storage_web: ^3.5.6
  js: ^0.6.7
  google_fonts: ^6.1.0
  provider: ^6.1.1
  mobile_scanner: ^3.5.7
  intl: ^0.19.0
  csv: ^5.1.1
  flutter_local_notifications: ^16.3.0
  connectivity_plus: ^5.0.2
  flutter_secure_storage: ^9.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
